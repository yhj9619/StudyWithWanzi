<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background Gradient (Brand Blue) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    
    <!-- Lightning Bolt Gradient (Vibrant Gold) -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Highlighting Border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.5"/>

  <!-- Open Book Graphic -->
  <g filter="url(#softShadow)">
    <!-- Book Base / Cover Rim -->
    <path d="M12 47 C20 44 26 46 32 50 C38 46 44 44 52 47 L52 43.5 C44 40.5 38 42.5 32 46.5 C26 42.5 20 40.5 12 43.5 Z" fill="#1e3a8a"/>
    <!-- Book Pages -->
    <path d="M12 44 C20 41 27 43 32 47 C37 43 44 41 52 44 L52 27 C44 24 37 26 32 30 C27 26 20 24 12 27 Z" fill="#ffffff"/>
    <!-- Spine Line -->
    <line x1="32" y1="30" x2="32" y2="47" stroke="#93c5fd" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Page Content Lines -->
    <line x1="18" y1="33" x2="26" y2="34.5" stroke="#bfdbfe" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="18" y1="38" x2="26" y2="39.5" stroke="#bfdbfe" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="38" y1="34.5" x2="46" y2="33" stroke="#bfdbfe" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="38" y1="39.5" x2="46" y2="38" stroke="#bfdbfe" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Golden Lightning Bolt (⚡ Study with Wanzi Symbol) -->
  <g filter="url(#softShadow)">
    <path d="M33 7 L23 22 L31 22 L27 33 L41 18 L33 18 Z" fill="url(#boltGrad)" stroke="#d97706" stroke-width="0.8" stroke-linejoin="round"/>
    <!-- Sparkles -->
    <polygon points="45,9 46.5,6 48,9 51,10.5 48,12 46.5,15 45,12 42,10.5" fill="#fef08a"/>
    <polygon points="20,13 21,11 22,13 24,14 22,15 21,17 20,15 18,14" fill="#fef08a"/>
  </g>
</svg>

